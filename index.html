<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulación Rayos X</title>

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<h1>SIMULACIÓN DE RAYOS X</h1>

<button id="btn">Tomar Radiografía</button>

<div class="contenedor">

    <!-- mano -->
    <img src="img/manonormal.png" class="mano">

    <!-- rayos x -->
    <img src="img/manorayos.png" class="mano-x" id="xray">

    //escaneo (solo mitad)//
    <div class="scan-zone">
        <div class="rayo" id="rayo"></div>
    </div>

    <!-- flash blanco -->
    <div class="flash" id="flash"></div>

</div>

<script src="js/script.js"></script>

</body>
</html>
